name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync
      - name: Unit + regression tests
        run: uv run pytest tests/unit tests/regression
      - name: Lint
        run: uv run ruff check .

  # Browser integration tests need Chromium + MiniWoB HTML; run manually.
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Fetch MiniWoB HTML
        run: git clone --depth 1 https://github.com/Farama-Foundation/miniwob-plusplus third_party/miniwob-plusplus
      - name: Integration tests
        run: uv run pytest tests/integration
