[project]
name = "web-harness"
version = "0.1.0"
description = "Reliable Web Workflow Agent Harness - a minimal, transparent, extensible, evaluable harness skeleton (Phase 0)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ethan Martinez" }]
dependencies = [
    "browsergym-core>=0.14,<0.15",
    "browsergym-miniwob>=0.14,<0.15",
    "gymnasium>=0.29",
    "openai>=1.40",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
web-harness = "web_harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_harness"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
markers = [
    "integration: integration tests that need a real browser environment",
]
